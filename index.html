<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Ocean Hunter Royale</title>
  <style>
    :root { --gold:#ffd24a; --cyan:#3ee7ff; }
    * { box-sizing:border-box; user-select:none; -webkit-tap-highlight-color:transparent; }
    html, body { margin:0; height:100%; overflow:hidden; background:#02010c; font-family:system-ui,Segoe UI,sans-serif; color:#fff; }
    #bg { position:fixed; inset:0; background:#041018 center/cover no-repeat; filter:saturate(1.15) contrast(1.08); transform:scale(1.06); z-index:0; }
    #bg::after { content:""; position:absolute; inset:0; background: radial-gradient(ellipse at 50% 20%, rgba(40,80,160,.18), transparent 50%), radial-gradient(ellipse at 50% 100%, rgba(0,0,0,.72), rgba(0,0,0,.28) 55%); }
    canvas { position:fixed; inset:0; width:100%; height:100%; z-index:1; cursor:crosshair; touch-action:none; }
    #hud { position:fixed; inset:0; z-index:3; pointer-events:none; }
    .top { display:flex; justify-content:space-between; align-items:flex-start; padding:8px 10px; gap:8px; }
    .chip { background:rgba(6,10,28,.78); border:1px solid rgba(255,210,74,.35); border-radius:12px; padding:7px 10px; min-width:96px; backdrop-filter:blur(6px); }
    .lbl { font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:#9ad; }
    .val { font-size:18px; font-weight:800; color:var(--gold); }
    .center { text-align:center; }
    .center h1 { margin:0; font-size:15px; letter-spacing:.16em; }
    .center .sub { color:var(--cyan); font-size:12px; margin-top:2px; }
    #timer { font-variant-numeric:tabular-nums; font-size:22px; font-weight:800; color:#fff; text-shadow:0 0 12px #3ee7ff; }
    .seats { position:absolute; left:0; right:0; bottom:0; display:flex; justify-content:space-between; padding:8px; gap:6px; pointer-events:auto; }
    .seat { flex:1; max-width:24%; background:rgba(8,12,30,.86); border:1px solid rgba(62,231,255,.25); border-radius:12px; padding:6px; font-size:11px; }
    .seat.you { border-color:#ffd24a; box-shadow:0 0 16px rgba(255,210,74,.25); }
    .seat .nm { font-weight:800; font-size:12px; }
    .seat .row { display:flex; gap:4px; margin-top:4px; flex-wrap:wrap; }
    button { border:0; border-radius:8px; padding:5px 7px; font-weight:800; cursor:pointer; background:#1b2748; color:#dff; font-size:11px; }
    button.on { background:#2ee6ff; color:#041018; }
    button.gold { background:linear-gradient(180deg,#ffd24a,#c48a00); color:#2a1800; }
    #overlay { display:none; position:fixed; inset:0; z-index:10; background:rgba(3,4,16,.72); align-items:center; justify-content:center; }
    #overlay.show { display:flex; }
    .card { width:min(420px,92vw); background:#10162c; border:1px solid #ffd24a; border-radius:18px; padding:18px; text-align:center; }
    .card h2 { margin:0 0 8px; }
    .card p { color:#cde; line-height:1.4; }
    .scores { text-align:left; margin:12px 0; }
    .scores div { display:flex; justify-content:space-between; padding:4px 0; border-bottom:1px solid #243; }
    #winPop { position:fixed; left:50%; top:26%; transform:translate(-50%,-50%); background:linear-gradient(180deg,#ffe57a,#ff9f1c); color:#2a1500; padding:12px 22px; border-radius:16px; font-weight:900; z-index:8; display:none; }
    #winPop.show { display:block; animation:pop 1.5s ease forwards; }
    @keyframes pop { 0%{opacity:0;transform:translate(-50%,-50%) scale(.6)} 20%{opacity:1;transform:translate(-50%,-50%) scale(1.08)} 100%{opacity:0} }
    #toast { position:fixed; left:50%; bottom:118px; transform:translateX(-50%); z-index:8; font-weight:800; text-shadow:0 2px 8px #000; pointer-events:none; }
  </style>
</head>
<body>
  <div id="bg"></div>
  <canvas id="sea"></canvas>
  <div id="hud">
    <div class="top">
      <div class="chip"><div class="lbl">House table</div><div class="val" id="lvlName">L1</div></div>
      <div class="center">
        <h1>OCEAN HUNTER ROYALE</h1>
        <div class="sub" id="lvlSub">CORAL SHALLOWS</div>
        <div id="timer">3:00</div>
      </div>
      <div class="chip" style="text-align:right"><div class="lbl">Round pot</div><div class="val" id="pot">$0.00</div></div>
    </div>
    <div class="seats" id="seats"></div>
  </div>
  <div id="winPop"></div>
  <div id="toast"></div>
  <div id="overlay"><div class="card" id="card"></div></div>
<script src="game.js"></script>
</body>
</html>
